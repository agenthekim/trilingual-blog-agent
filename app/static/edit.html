<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edit</title>
<link rel="stylesheet" href="/static/edit.css">
</head>
<body>
<main>
  <div class="bar"><strong id="name"></strong> &middot; editing &middot; <a id="view">back to the preview</a></div>
  <label class="field hidden" id="titleField">Title<input type="text" id="title" maxlength="120"></label>
  <textarea id="text" spellcheck="false" aria-label="File text" disabled></textarea>
  <footer>
    <span class="muted small" id="result" role="status">Loading…</span>
    <span class="hidden" id="deckTools" style="display:flex; align-items:center; gap:8px">
      <a id="deckLink" target="_blank" rel="noopener" class="small">Open the deck</a>
      <button type="button" id="pull">Pull from deck…</button>
      <button type="button" id="push">Update deck…</button>
      <span class="sep"></span>
    </span>
    <button type="button" id="cancel">Cancel</button>
    <button type="button" class="primary" id="save" disabled>Save</button>
  </footer>
</main>

<!-- Shown before anything is written to the deck, or before the deck's text replaces the file's. -->
<dialog id="confirmDialog">
  <div class="body">
    <h2 id="confirmTitle"></h2>
    <dl class="summary" id="confirmSummary"></dl>
    <p class="small" id="confirmNote" style="margin:0"></p>
  </div>
  <div class="foot">
    <button type="button" id="confirmCancel">Cancel</button>
    <button type="button" class="primary" id="confirmOk"></button>
  </div>
</dialog>

<script src="/static/edit.js"></script>
</body>
</html>
