# Runs on every push and pull request (OPS-6 in docs/SPEC.md).
# Nothing here needs a credential: the unit tests refuse the network and
# models, and Terraform is only formatted and validated, never planned or
# applied.
#
# Every step writes what it prints to one file as well. When a step fails,
# the end of that file is shown as an error on the commit, so the reason can
# be read without opening the log.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_eval:
        description: "Run agents-cli eval against Vertex AI (requires GCP_WIF_PROVIDER, GCP_WIF_SERVICE_ACCOUNT, GOOGLE_CLOUD_PROJECT secrets)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  LAST_OUTPUT: ${{ github.workspace }}/.ci-last-output.txt

defaults:
  run:
    # Named explicitly: this is what turns on pipefail, without which a
    # failing command in front of "| tee" would count as a success.
    shell: bash

jobs:
  python:
    name: Linter and unit tests
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.13"
      # The repository carries no lock file (docs/SPEC.md, section 8, item 4):
      # the dependencies are resolved from PyPI within the ranges of
      # pyproject.toml.
      UV_DEFAULT_INDEX: https://pypi.org/simple
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: uv sync --extra lint 2>&1 | tee "$LAST_OUTPUT"
      - name: Linter
        run: uv run ruff check . 2>&1 | tee "$LAST_OUTPUT"
      - name: Formatting
        run: uv run ruff format --check . 2>&1 | tee "$LAST_OUTPUT"
      - name: Unit tests
        run: uv run pytest tests/unit -q 2>&1 | tee "$LAST_OUTPUT"
      - name: Say why it failed
        if: failure()
        run: |
          text="$(tail -c 6000 "$LAST_OUTPUT" | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\r//g;s/\n/%0A/g')"
          echo "::error title=Last output of the failed step::$text"

  terraform:
    name: Terraform validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          # The wrapper hides the exit code behind a pipe; plain terraform does not.
          terraform_wrapper: false
      - name: Formatting
        run: terraform fmt -check -diff -recursive deployment/terraform 2>&1 | tee "$LAST_OUTPUT"
      - name: Init without a backend
        working-directory: deployment/terraform/single-project
        run: terraform init -backend=false -input=false 2>&1 | tee "$LAST_OUTPUT"
      - name: Validate
        working-directory: deployment/terraform/single-project
        run: terraform validate -no-color 2>&1 | tee "$LAST_OUTPUT"
      - name: Say why it failed
        if: failure()
        run: |
          text="$(tail -c 12000 "$LAST_OUTPUT" | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\r//g;s/\n/%0A/g')"
          echo "::error title=Last output of the failed step::$text"

  evaluate:
    name: Agent evaluation (manual, requires Vertex AI credentials)
    if: github.event_name == 'workflow_dispatch' && inputs.run_eval == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      UV_PYTHON: "3.13"
      UV_DEFAULT_INDEX: https://pypi.org/simple
      GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
      GOOGLE_CLOUD_LOCATION: us-central1
      GOOGLE_GENAI_USE_VERTEXAI: "TRUE"
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies and agents-cli
        run: |
          uv sync --extra lint
          uv tool install google-agents-cli
      - name: Run evaluation suite
        run: |
          BLOG_AGENT_WORKSPACE_DIR="$(mktemp -d)" \
          LOCAL_SESSION_DB="$(mktemp -u).sqlite3" \
          uv run agents-cli eval run --config tests/eval/eval_config.yaml --dataset tests/eval/datasets/basic-dataset.json
